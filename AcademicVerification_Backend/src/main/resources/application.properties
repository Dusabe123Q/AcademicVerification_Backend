# --- DATABASE CONFIGURATION ---
# If SPRING_DATASOURCE_URL exists (Render), use it. Otherwise, use local MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/academic_verification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- THE DIALECT (The most important part) ---
# Locally this defaults to MySQL. On Render, you MUST set HIBERNATE_DIALECT to PostgreSQLDialect.
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# --- HIBERNATE SETTINGS ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

