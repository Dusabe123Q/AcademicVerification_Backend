<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credentials - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <a href="/admin/dashboard" class="sidebar-brand">
            <i class="bi bi-shield-check text-primary"></i> Admin Portal
        </a>
        <div class="sidebar-nav">
            <a href="/admin/dashboard" class="nav-link sidebar-link">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="/admin/students" class="nav-link sidebar-link">
                <i class="bi bi-people"></i> Students
            </a>
            <a href="/admin/credentials" class="nav-link sidebar-link active">
                <i class="bi bi-file-earmark-text"></i> Credentials
            </a>
            <a href="/admin/logs" class="nav-link sidebar-link">
                <i class="bi bi-journal-text"></i> Verification Logs
            </a>
        </div>
        <div class="p-3 border-top border-secondary">
            <button class="btn btn-outline-light w-100 logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <button class="btn btn-light d-md-none" id="sidebar-toggle">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-muted fw-medium" id="user-display">Admin</span>
                <i class="bi bi-person-circle fs-4 text-primary"></i>
            </div>
        </header>

        <!-- Content -->
        <div class="content-area container-fluid">
            <h2 class="fw-bold mb-4">Issue Credential</h2>
            <div id="alert-container"></div>

            <div class="row">
                <!-- Form to Issue Credential -->
                <div class="col-12 col-lg-5 mb-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4">New Credential Form</h5>
                            <form id="issueForm">
                                <div class="mb-3">
                                    <label class="form-label text-muted">Select Student</label>
                                    <select class="form-select" id="studentSelect" required>
                                        <option value="">Loading students...</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted">Credential Type</label>
                                    <select class="form-select" id="credType" required>
                                        <option value="Bachelor's Degree">Bachelor's Degree</option>
                                        <option value="Master's Degree">Master's Degree</option>
                                        <option value="PhD">PhD</option>
                                        <option value="Certificate">Certificate</option>
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted">Issue Date</label>
                                    <input type="date" class="form-control" id="issueDate" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                    <i class="bi bi-award-fill"></i> Issue Credential
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Generated Credential Display -->
                <div class="col-12 col-lg-7 mb-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100" id="certificateDisplay" style="display: none;">
                        <div class="card-body p-5 position-relative">
                            <div class="text-center mb-5">
                                <i class="bi bi-award-fill text-primary" style="font-size: 3rem;"></i>
                                <h3 class="fw-bold mt-2" id="certType">Degree Certificate</h3>
                                <p class="text-muted mb-0">This certifies that</p>
                                <h4 class="fw-bold mt-2 text-primary" id="certStudentName">John Doe</h4>
                                <p class="text-muted mt-2">has successfully completed the requirements.</p>
                                <p class="mb-0 mt-4"><strong>Issue Date:</strong> <span id="certDate"></span></p>
                                <p class="mb-0"><strong>Serial Number:</strong> <span id="certSerial" class="text-monospace bg-light px-2 rounded"></span></p>
                            </div>
                            
                            <div class="d-flex justify-content-center mt-4">
                                <div id="qrcode" class="p-2 border rounded bg-white" style="width: 150px; height: 150px;"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Placeholder when empty -->
                    <div class="card border-0 shadow-sm rounded-4 h-100 d-flex align-items-center justify-content-center bg-light" id="certificatePlaceholder">
                        <div class="text-center text-muted p-5">
                            <i class="bi bi-file-earmark-text fs-1"></i>
                            <p class="mt-3">Issued credential will appear here.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Global Loader -->
<div id="global-loader"><div class="spinner-border text-primary" role="status"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- QRCode.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/main.js}"></script>

<script>
    let studentsMap = {};
    let qrCodeObj = null;

    document.addEventListener('DOMContentLoaded', async () => {
        if(!AUTH_API.checkAuth('ADMIN')) return;
        
        // Load Students into Select
        try {
            const students = await fetchApi('/students', { method: 'GET' });
            const select = document.getElementById('studentSelect');
            select.innerHTML = '<option value="">Select a student...</option>';
            students.forEach(s => {
                studentsMap[s.id] = s;
                select.innerHTML += `<option value="${s.id}">${s.name} (${s.email})</option>`;
            });
        } catch (err) {
            showAlert('Failed to list students.', 'danger');
        }

        // Set default issue date to today
        document.getElementById('issueDate').valueAsDate = new Date();

        // Handle issue credential form
        document.getElementById('issueForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentId = document.getElementById('studentSelect').value;
            const type = document.getElementById('credType').value;
            const issueDate = document.getElementById('issueDate').value;
            
            const payload = {
                studentId: studentId,
                credentialType: type,
                issueDate: issueDate
            };

            try {
                // Post to API to create credential. Expecting details back including serialNumber.
                const response = await fetchApi('/credentials', { method: 'POST', body: JSON.stringify(payload) });
                showAlert('Credential issued successfully!', 'success');
                displayCertificate(response, studentId);
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        });
    });

    function displayCertificate(credData, studentId) {
        document.getElementById('certificatePlaceholder').style.display = 'none';
        document.getElementById('certificateDisplay').style.display = 'block';

        const student = studentsMap[studentId];
        
        document.getElementById('certType').innerText = credData.credentialType || credData.type || 'Certificate';
        document.getElementById('certStudentName').innerText = student ? student.name : 'Student';
        document.getElementById('certDate').innerText = formatDate(credData.issueDate);
        document.getElementById('certSerial').innerText = credData.serialNumber || 'N/A';

        // Generate QR using the serial number
        document.getElementById('qrcode').innerHTML = ''; // Clear prev
        if (credData.serialNumber) {
            // Include full verification URL inside the QR
            const verifyUrl = `${window.location.origin}/verify?serialNumber=${credData.serialNumber}`;
            new QRCode(document.getElementById('qrcode'), {
                text: verifyUrl,
                width: 134,
                height: 134,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    }
</script>

</body>
</html>
