<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Academic Verification</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <a href="/admin/dashboard" class="sidebar-brand">
            <i class="bi bi-shield-check text-primary"></i>
            Admin Portal
        </a>
        <div class="sidebar-nav">
            <a href="/admin/dashboard" class="nav-link sidebar-link active">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="/admin/students" class="nav-link sidebar-link">
                <i class="bi bi-people"></i> Students
            </a>
            <a href="/admin/credentials" class="nav-link sidebar-link">
                <i class="bi bi-file-earmark-text"></i> Credentials
            </a>
            <a href="/admin/logs" class="nav-link sidebar-link">
                <i class="bi bi-journal-text"></i> Verification Logs
            </a>
        </div>
        <div class="p-3 border-top border-secondary">
            <button class="btn btn-outline-light w-100 logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <button class="btn btn-light d-md-none" id="sidebar-toggle">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-muted fw-medium" id="user-display">Admin</span>
                <i class="bi bi-person-circle fs-4 text-primary"></i>
            </div>
        </header>

        <!-- Content -->
        <div class="content-area container-fluid">
            <h2 class="mb-4 fw-bold">Dashboard Overview</h2>
            
            <div id="alert-container"></div>

            <div class="row g-4 mb-4">
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="stat-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                <i class="bi bi-people-fill"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Total Students</h6>
                                <h3 class="fw-bold mb-0" id="stat-students">-</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Add more stat cards as needed -->
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="stat-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="stat-icon bg-success bg-opacity-10 text-success">
                                <i class="bi bi-patch-check-fill"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Credentials Issued</h6>
                                <h3 class="fw-bold mb-0" id="stat-credentials">-</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity Table could go here -->
            <div class="table-glass p-4 mt-4">
                <h5 class="fw-bold mb-3">Quick Actions</h5>
                <div class="d-flex gap-2">
                    <a href="/admin/students" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Manage Students</a>
                    <a href="/admin/credentials" class="btn btn-outline-primary"><i class="bi bi-file-earmark-plus"></i> Issue Credential</a>
                </div>
            </div>
            
        </div>
    </main>
</div>

<!-- Global Loader -->
<div id="global-loader">
    <div class="spinner-border text-primary" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/main.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Enforce Admin Access
        if(!AUTH_API.checkAuth('ADMIN')) return;
        
        // Fetch dashboard stats (Optional API binding, implement if exists)
        try {
            // Suppose /api/students returns an array of students
            const students = await fetchApi('/students', { method: 'GET' });
            document.getElementById('stat-students').innerText = students.length || 0;
            
            // Suppose /api/credentials returns an array
            // const creds = await fetchApi('/credentials', { method: 'GET' });
            // document.getElementById('stat-credentials').innerText = creds.length || 0;
        } catch (err) {
            console.error(err);
        }
    });
</script>

</body>
</html>
