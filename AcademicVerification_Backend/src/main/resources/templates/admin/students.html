<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <a href="/admin/dashboard" class="sidebar-brand">
            <i class="bi bi-shield-check text-primary"></i> Admin Portal
        </a>
        <div class="sidebar-nav">
            <a href="/admin/dashboard" class="nav-link sidebar-link">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="/admin/students" class="nav-link sidebar-link active">
                <i class="bi bi-people"></i> Students
            </a>
            <a href="/admin/credentials" class="nav-link sidebar-link">
                <i class="bi bi-file-earmark-text"></i> Credentials
            </a>
            <a href="/admin/logs" class="nav-link sidebar-link">
                <i class="bi bi-journal-text"></i> Verification Logs
            </a>
        </div>
        <div class="p-3 border-top border-secondary">
            <button class="btn btn-outline-light w-100 logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <button class="btn btn-light d-md-none" id="sidebar-toggle">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-muted fw-medium" id="user-display">Admin</span>
                <i class="bi bi-person-circle fs-4 text-primary"></i>
            </div>
        </header>

        <!-- Content -->
        <div class="content-area container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">Students Management</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#studentModal" onclick="openAddModal()">
                    <i class="bi bi-person-plus"></i> Add Student
                </button>
            </div>

            <div id="alert-container"></div>

            <div class="table-glass">
                <div class="p-3 border-bottom d-flex gap-2 bg-white">
                    <input type="text" class="form-control w-25" id="searchInput" placeholder="Search by name or email..">
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="studentsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Student Modal (Add/Edit) -->
<div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3" id="passwordGroup">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="global-loader"><div class="spinner-border text-primary" role="status"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/main.js}"></script>

<script>
    let allStudents = [];
    const modal = new bootstrap.Modal(document.getElementById('studentModal'));

    document.addEventListener('DOMContentLoaded', async () => {
        if(!AUTH_API.checkAuth('ADMIN')) return;
        await loadStudents();

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.name?.toLowerCase().includes(term) || s.email?.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('studentId').value;
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
            };
            
            // Password only required if new, or if explicitly changing
            const pwd = document.getElementById('password').value;
            if(pwd) payload.password = pwd;

            try {
                if (id) {
                    await fetchApi(`/students/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                    showAlert('Student updated successfully.', 'success');
                } else {
                    await fetchApi('/students', { method: 'POST', body: JSON.stringify(payload) });
                    showAlert('Student added successfully.', 'success');
                }
                modal.hide();
                loadStudents();
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        });
    });

    async function loadStudents() {
        try {
            allStudents = await fetchApi('/students', { method: 'GET' });
            renderTable(allStudents);
        } catch (err) {
            showAlert('Failed to load students: ' + err.message, 'danger');
        }
    }

    function renderTable(students) {
        const tbody = document.querySelector('#studentsTable tbody');
        if (!students || students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No students found.</td></tr>';
            return;
        }
        tbody.innerHTML = students.map(s => `
            <tr>
                <td>#${s.id}</td>
                <td class="fw-medium">${s.name || '-'}</td>
                <td>${s.email || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-2" onclick="openEditModal(${s.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${s.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function openAddModal() {
        document.getElementById('studentId').value = '';
        document.getElementById('studentForm').reset();
        document.getElementById('modalTitle').innerText = 'Add Student';
        document.getElementById('passwordGroup').style.display = 'block';
    }

    function openEditModal(id) {
        const student = allStudents.find(s => s.id === id);
        if(!student) return;
        document.getElementById('studentId').value = student.id;
        document.getElementById('name').value = student.name;
        document.getElementById('email').value = student.email;
        document.getElementById('password').value = '';
        document.getElementById('modalTitle').innerText = 'Edit Student';
        // Password optional on edit
        document.getElementById('passwordGroup').style.display = 'block';
        modal.show();
    }

    async function deleteStudent(id) {
        if(!confirm('Are you sure you want to delete this student?')) return;
        try {
            await fetchApi(`/students/${id}`, { method: 'DELETE' });
            showAlert('Student deleted.', 'success');
            loadStudents();
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }
</script>

</body>
</html>
