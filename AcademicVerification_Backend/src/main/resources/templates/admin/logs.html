<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Logs - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <a href="/admin/dashboard" class="sidebar-brand">
            <i class="bi bi-shield-check text-primary"></i> Admin Portal
        </a>
        <div class="sidebar-nav">
            <a href="/admin/dashboard" class="nav-link sidebar-link">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="/admin/students" class="nav-link sidebar-link">
                <i class="bi bi-people"></i> Students
            </a>
            <a href="/admin/credentials" class="nav-link sidebar-link">
                <i class="bi bi-file-earmark-text"></i> Credentials
            </a>
            <a href="/admin/logs" class="nav-link sidebar-link active">
                <i class="bi bi-journal-text"></i> Verification Logs
            </a>
        </div>
        <div class="p-3 border-top border-secondary">
            <button class="btn btn-outline-light w-100 logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <button class="btn btn-light d-md-none" id="sidebar-toggle">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-muted fw-medium" id="user-display">Admin</span>
                <i class="bi bi-person-circle fs-4 text-primary"></i>
            </div>
        </header>

        <!-- Content -->
        <div class="content-area container-fluid">
            <h2 class="fw-bold mb-4">Verification Logs</h2>
            <div id="alert-container"></div>

            <div class="table-glass">
                <div class="table-responsive p-0">
                    <table class="table table-hover mb-0" id="logsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Request Date</th>
                                <th>Serial Number</th>
                                <th>Status</th>
                                <th>IP Address / Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </main>
</div>

<!-- Global Loader -->
<div id="global-loader"><div class="spinner-border text-primary" role="status"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/main.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if(!AUTH_API.checkAuth('ADMIN')) return;
        
        try {
            const logs = await fetchApi('/verification/logs', { method: 'GET' });
            renderLogs(logs);
        } catch (err) {
            showAlert('Failed to load verification logs: ' + err.message, 'danger');
        }
    });

    function renderLogs(logs) {
        const tbody = document.querySelector('#logsTable tbody');
        if (!logs || logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No logs found.</td></tr>';
            return;
        }
        
        // Sort descending by date (assume requestDate exists)
        logs.sort((a,b) => new Date(b.requestDate) - new Date(a.requestDate));

        tbody.innerHTML = logs.map((log, index) => {
            const isSuccess = log.status === 'SUCCESS' || log.status === 'VERIFIED';
            const badgeClass = isSuccess ? 'bg-success' : 'bg-danger';
            
            return `
            <tr>
                <td>${index + 1}</td>
                <td>${new Date(log.requestDate || new Date()).toLocaleString()}</td>
                <td><span class="font-monospace text-primary fw-medium">${log.serialNumber || log.credential || '-'}</span></td>
                <td><span class="badge ${badgeClass}">${log.status}</span></td>
                <td class="text-muted">${log.details || log.ipAddress || '-'}</td>
            </tr>
        `}).join('');
    }
</script>

</body>
</html>
