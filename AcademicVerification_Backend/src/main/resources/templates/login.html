<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Academic Verification</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">

    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Welcome Back</h2>
            <p class="text-muted">Sign in to your account</p>
        </div>

        <div id="alert-container"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label fw-medium text-dark">Email address</label>
                <input type="email" class="form-control form-control-lg bg-light" id="email" required placeholder="name@example.com">
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label fw-medium text-dark">Password</label>
                <input type="password" class="form-control form-control-lg bg-light" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold shadow-sm">
                Sign In
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted mb-2">Don't have an account? <a href="/register" class="fw-bold text-primary text-decoration-none">Register</a></p>
            <a href="/verify" class="text-decoration-none text-muted btn btn-link">Verify a Credential Instead</a>
        </div>
    </div>

    <!-- Global Loader -->
    <div id="global-loader">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showAlert('Please fill in all fields.', 'warning');
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';
            btn.disabled = true;

            try {
                await AUTH_API.login(email, password);
                // Redirect happens in auth.js
            } catch (err) {
                showAlert(err.message || 'Login failed', 'danger');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Auto redirect if already logged in
        if (AUTH_API.isAuthenticated()) {
            const role = localStorage.getItem('userRole');
            if(role === 'ADMIN') window.location.href = '/admin/dashboard';
            else if(role === 'ALUMNI') window.location.href = '/alumni/dashboard';
            // Employers go to /verify typically but login might redirect there depending on logic
        }
    </script>
</body>
</html>
