<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Dashboard - Academic Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <a href="/alumni/dashboard" class="sidebar-brand">
            <i class="bi bi-mortarboard-fill text-primary"></i> Alumni Portal
        </a>
        <div class="sidebar-nav">
            <a href="/alumni/dashboard" class="nav-link sidebar-link active">
                <i class="bi bi-person-badge"></i> My Profile
            </a>
            <a href="/alumni/employment" class="nav-link sidebar-link">
                <i class="bi bi-briefcase"></i> Employment History
            </a>
        </div>
        <div class="p-3 border-top border-secondary">
            <button class="btn btn-outline-light w-100 logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button class="btn btn-light d-md-none" id="sidebar-toggle">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-muted fw-medium" id="user-display">Alumnus</span>
                <i class="bi bi-person-circle fs-4 text-primary"></i>
            </div>
        </header>

        <div class="content-area container-fluid">
            <h2 class="fw-bold mb-4">My Dashboard</h2>
            <div id="alert-container"></div>

            <div class="row g-4">
                <!-- Profile Card -->
                <div class="col-12 col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100 text-center p-4">
                        <div class="d-flex justify-content-center mb-3">
                            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; font-size: 2.5rem;">
                                <i class="bi bi-person-fill"></i>
                            </div>
                        </div>
                        <h4 class="fw-bold mb-1" id="profileName">Loading...</h4>
                        <p class="text-muted mb-3" id="profileEmail"></p>
                        
                        <div class="text-start mt-4">
                            <h6 class="fw-bold text-uppercase text-muted" style="font-size: 0.8rem;">Profile Info</h6>
                            <hr class="mt-1 mb-2">
                            <p class="mb-1"><i class="bi bi-telephone text-primary me-2"></i> <span id="profilePhone">-</span></p>
                            <p class="mb-1"><i class="bi bi-geo-alt text-primary me-2"></i> <span id="profileGradYear">-</span></p>
                        </div>
                    </div>
                </div>

                <!-- Credentials List -->
                <div class="col-12 col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 h-100 p-4">
                        <h5 class="fw-bold mb-4">My Credentials</h5>
                        <div id="credentialsList" class="row g-3">
                            <!-- Populated via JS -->
                        </div>
                        <div id="noCreds" class="text-center text-muted p-5 sticky-bottom" style="display: none;">
                            <i class="bi bi-file-earmark-x fs-1"></i>
                            <p class="mt-3">No credentials found.</p>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>
</div>

<!-- Global Loader -->
<div id="global-loader"><div class="spinner-border text-primary" role="status"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/main.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if(!AUTH_API.checkAuth('ALUMNI')) return;
        
        try {
            // Suppose API returns profile + credentials together, or we make two calls
            const profile = await fetchApi('/alumni/profile', { method: 'GET' });
            
            document.getElementById('profileName').innerText = profile.name || 'Student';
            document.getElementById('profileEmail').innerText = profile.email || localStorage.getItem('userEmail');
            document.getElementById('profilePhone').innerText = profile.phoneNumber || profile.phone || '-';
            document.getElementById('profileGradYear').innerText = `Graduation Year: ${profile.graduationYear || '-'}`;
            
            const creds = profile.credentials || [];
            
            if (creds.length === 0) {
                document.getElementById('noCreds').style.display = 'block';
            } else {
                const credsHtml = creds.map(c => `
                    <div class="col-12 col-md-6">
                        <div class="border rounded-3 p-3 position-relative overflow-hidden">
                            <div class="position-absolute end-0 top-0 p-3 text-primary opacity-25">
                                <i class="bi bi-award-fill" style="font-size: 4rem;"></i>
                            </div>
                            <h6 class="fw-bold fs-5 mb-1 position-relative z-1">${c.credentialType || c.type}</h6>
                            <p class="text-muted small mb-3 position-relative z-1">Issued: ${formatDate(c.issueDate)}</p>
                            <div class="d-flex align-items-center gap-2 position-relative z-1">
                                <span class="badge bg-light text-dark font-monospace border">Serial: ${c.serialNumber}</span>
                                <a href="/verify?serialNumber=${c.serialNumber}" class="btn btn-sm btn-outline-primary ms-auto" target="_blank">View Verification</a>
                            </div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('credentialsList').innerHTML = credsHtml;
            }

        } catch (err) {
            showAlert('Failed to load profile details: ' + err.message, 'danger');
        }
    });
</script>

</body>
</html>
